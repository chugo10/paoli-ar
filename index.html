
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Paoli - 300 Anni en réalité augmentée</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Georgia, serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
    }

    .interface {
      position: fixed;
      z-index: 100;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      color: #f0d18a;
      text-align: center;
    }

    .titre {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 5px #000;
    }

    #message {
      font-family: Arial, sans-serif;
      font-size: 15px;
      color: white;
      text-shadow: 0 2px 5px black;
    }
  </style>
</head>

<body>

  <div class="interface">
    <div class="titre">
      UNIVERSITÀ DI CORSICA · PASQUALE PAOLI
    </div>

    <div id="message">
      Recherche de la bannière...
    </div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/paoli.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- CIBLE : LA BANNIÈRE -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- LIVRE ANCIEN -->
      <a-entity
        id="livre"
        position="-0.16 0.02 0.12"
        scale="0.001 0.001 0.001">

        <!-- DOS DU LIVRE -->
        <a-box
          position="0 0 0"
          width="0.32"
          height="0.025"
          depth="0.21"
          material="color: #54251a; roughness: 0.8">
        </a-box>

        <!-- PAGES -->
        <a-box
          position="0 0.017 0"
          width="0.30"
          height="0.012"
          depth="0.19"
          material="color: #e8d9b5">
        </a-box>

        <!-- PAGE GAUCHE -->
        <a-box
          position="-0.075 0.025 0"
          width="0.145"
          height="0.008"
          depth="0.18"
          material="color: #f4e8c9">
        </a-box>

        <!-- PAGE DROITE -->
        <a-box
          position="0.075 0.025 0"
          width="0.145"
          height="0.008"
          depth="0.18"
          material="color: #f4e8c9">
        </a-box>

        <!-- COUVERTURE GAUCHE -->
        <a-box
          position="-0.08 0.035 0"
          width="0.16"
          height="0.015"
          depth="0.21"
          material="color: #54251a; metalness: 0.2">
        </a-box>

        <!-- COUVERTURE DROITE ARTICULÉE -->
        <a-entity id="couverture" position="0 0.035 0">

          <a-box
            position="0.08 0 0"
            width="0.16"
            height="0.015"
            depth="0.21"
            material="color: #682d1d; metalness: 0.2">
          </a-box>

          <!-- ORNEMENT DORÉ -->
          <a-box
            position="0.08 0.009 0"
            width="0.13"
            height="0.002"
            depth="0.17"
            material="color: #d9b56d; metalness: 0.7">
          </a-box>

          <a-text
            value="PAOLI"
            position="0.08 0.012 0"
            rotation="-90 0 0"
            align="center"
            color="#f4d58d"
            width="0.3">
          </a-text>

        </a-entity>

        <!-- PORTRAIT ET PAYSAGE QUI SORTENT DU LIVRE -->
        <a-entity
          id="popUp"
          position="0 0.04 0"
          scale="0.001 0.001 0.001">

          <!-- MÉDAILLON -->
          <a-cylinder
            position="0.07 0.08 0"
            radius="0.04"
            height="0.01"
            rotation="90 0 0"
            material="color: #bd9148; metalness: 0.7">
          </a-cylinder>

          <!-- VISAGE STYLISÉ -->
          <a-sphere
            position="0.07 0.10 0.01"
            radius="0.022"
            material="color: #d8b28a">
          </a-sphere>

          <!-- CHEVEUX -->
          <a-sphere
            position="0.07 0.115 0.01"
            radius="0.024"
            scale="1 0.55 0.9"
            material="color: #27384b">
          </a-sphere>

          <!-- MONTAGNES CORSES -->
          <a-cone
            position="-0.07 0.07 -0.02"
            radius-bottom="0.055"
            radius-top="0.001"
            height="0.10"
            material="color: #526c59">
          </a-cone>

          <a-cone
            position="-0.01 0.08 -0.02"
            radius-bottom="0.07"
            radius-top="0.001"
            height="0.13"
            material="color: #8b9b78">
          </a-cone>

        </a-entity>

      </a-entity>

      <!-- HALO DORÉ -->
      <a-torus
        id="halo"
        position="-0.16 0 0.15"
        radius="0.19"
        radius-tubular="0.004"
        material="
          color: #e7c477;
          emissive: #a9782c;
          emissiveIntensity: 1.5
        "
        scale="0.001 0.001 0.001">
      </a-torus>

      <!-- PARTICULES -->
      <a-entity id="particules">

        <a-sphere
          class="etincelle"
          position="-0.36 0.02 0.14"
          radius="0.008"
          material="color: #f3d48a; emissive: #e8b94f"
          scale="0.001 0.001 0.001">
        </a-sphere>

        <a-sphere
          class="etincelle"
          position="-0.02 0.06 0.16"
          radius="0.008"
          material="color: #f3d48a; emissive: #e8b94f"
          scale="0.001 0.001 0.001">
        </a-sphere>

        <a-sphere
          class="etincelle"
          position="-0.34 -0.05 0.12"
          radius="0.008"
          material="color: #f3d48a; emissive: #e8b94f"
          scale="0.001 0.001 0.001">
        </a-sphere>

      </a-entity>

      <!-- TITRE 300 ANNI -->
      <a-entity
        id="titre300"
        position="0.29 0 0.13"
        scale="0.001 0.001 0.001">

        <a-text
          value="300"
          position="0 0.04 0"
          align="center"
          color="#f0d18a"
          width="1.1">
        </a-text>

        <a-text
          value="ANNI"
          position="0 -0.025 0"
          align="center"
          color="#f0d18a"
          width="0.8">
        </a-text>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const cible = document.querySelector("#target");
    const livre = document.querySelector("#livre");
    const couverture = document.querySelector("#couverture");
    const popUp = document.querySelector("#popUp");
    const halo = document.querySelector("#halo");
    const titre300 = document.querySelector("#titre300");
    const message = document.querySelector("#message");
    const etincelles = document.querySelectorAll(".etincelle");

    let animation;

    function remettreAZero() {
      if (animation) animation.kill();

      livre.setAttribute("scale", "0.001 0.001 0.001");
      couverture.setAttribute("rotation", "0 0 0");
      popUp.setAttribute("scale", "0.001 0.001 0.001");
      halo.setAttribute("scale", "0.001 0.001 0.001");
      titre300.setAttribute("scale", "0.001 0.001 0.001");

      etincelles.forEach(e => {
        e.setAttribute("scale", "0.001 0.001 0.001");
      });
    }

    function lancerAnimation() {
      remettreAZero();

      const etat = {
        livre: 0.001,
        halo: 0.001,
        ouverture: 0,
        relief: 0.001,
        titre: 0.001
      };

      animation = gsap.timeline();

      // Le livre apparaît
      animation.to(etat, {
        livre: 1,
        duration: 0.7,
        ease: "back.out(1.5)",
        onUpdate: () => {
          livre.setAttribute(
            "scale",
            `${etat.livre} ${etat.livre} ${etat.livre}`
          );
        }
      }, 0);

      // Le halo doré
      animation.to(etat, {
        halo: 1,
        duration: 0.7,
        onUpdate: () => {
          halo.setAttribute(
            "scale",
            `${etat.halo} ${etat.halo} ${etat.halo}`
          );
        }
      }, 0.2);

      // Le livre s'ouvre
      animation.to(etat, {
        ouverture: -155,
        duration: 1.25,
        ease: "power2.inOut",
        onUpdate: () => {
          couverture.setAttribute(
            "rotation",
            `0 ${etat.ouverture} 0`
          );
        }
      }, 0.8);

      // Le portrait et les montagnes apparaissent
      animation.to(etat, {
        relief: 1,
        duration: 0.8,
        ease: "back.out(1.8)",
        onUpdate: () => {
          popUp.setAttribute(
            "scale",
            `${etat.relief} ${etat.relief} ${etat.relief}`
          );
        }
      }, 2.2);

      // Les particules scintillent
      etincelles.forEach((e, i) => {
        const p = { s: 0.001 };

        animation.to(p, {
          s: 1,
          duration: 0.3,
          yoyo: true,
          repeat: 2,
          onUpdate: () => {
            e.setAttribute("scale", `${p.s} ${p.s} ${p.s}`);
          }
        }, 1.6 + i * 0.15);
      });

      // Le titre apparaît
      animation.to(etat, {
        titre: 1,
        duration: 0.65,
        ease: "back.out(1.8)",
        onUpdate: () => {
          titre300.setAttribute(
            "scale",
            `${etat.titre} ${etat.titre} ${etat.titre}`
          );
        }
      }, 4);

      animation.call(() => {
        message.textContent = "300 ANNI · PASQUALE PAOLI";
      }, [], 5);
    }

    cible.addEventListener("targetFound", () => {
      message.textContent = "Bannière reconnue !";
      lancerAnimation();
    });

    cible.addEventListener("targetLost", () => {
      message.textContent = "Recherche de la bannière...";
      remettreAZero();
    });

    const scene = document.querySelector("a-scene");

    scene.addEventListener("arReady", () => {
      message.textContent = "Caméra prête · Scanne la bannière";
    });

    scene.addEventListener("arError", () => {
      message.textContent = "Erreur AR : vérifie la caméra et la cible MindAR";
    });
  </script>

</body>
</html>
